name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --dev
      - run: uv run ruff check services/agent services/mcp-tools tests scripts
      - run: uv run ruff format --check services/agent services/mcp-tools tests scripts
      - run: uv run pytest -m "not e2e" --cov --cov-fail-under=80

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: services/gateway/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  containers:
    runs-on: ubuntu-latest
    needs: [python, go]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build gateway worker mcp-tools

