[project]
name = "support-agent-template"
version = "0.1.0"
description = "Production-oriented LangGraph customer support reference project"
requires-python = ">=3.13,<3.15"
dependencies = [
  "chromadb==1.5.9",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langchain==1.3.15",
  "langchain-anthropic==1.5.6",
  "langchain-google-genai==4.3.3",
  "langchain-mcp-adapters==0.3.2",
  "langchain-openai==1.4.3",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  # MCP 2.0 is not yet supported by the current LangChain adapter release.
  "mcp==1.26.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.2",
  "redis==8.1.0",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/agent/tests", "tests/e2e"]
pythonpath = ["services/agent"]
markers = ["e2e: tests that require the running container stack"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"services/agent/app/api/routes.py" = ["B008"]

[tool.coverage.run]
source = ["services/agent/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/agent/app"]
