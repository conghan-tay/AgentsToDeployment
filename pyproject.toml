[project]
name = "support-agent-template"
version = "0.1.0"
description = "Production-oriented LangGraph customer support reference project"
requires-python = ">=3.13,<3.15"
dependencies = [
  "chromadb==1.5.9",
  "langchain==1.3.15",
  "langchain-anthropic==1.5.6",
  "langchain-google-genai==4.3.3",
  "langchain-mcp-adapters==0.3.2",
  "langchain-openai==1.4.3",
  "langgraph==1.2.11",
  # MCP 2.0 is not yet supported by the current LangChain adapter release.
  "mcp==1.26.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.2",
  "redis==8.1.0",
  "structlog==26.1.0",
  # The langgraph extra runs graph nodes as Temporal activities; pydantic lets the
  # schemas in app/core/schemas.py cross the workflow/activity boundary directly.
  # Deliberately not the `langsmith` extra: it pins langsmith<0.9, while
  # langchain-core requires >=0.3.45,<1.0.0. Tracing works via LANGSMITH_* env vars.
  "temporalio[langgraph,pydantic]==1.31.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/agent/tests", "tests/e2e"]
pythonpath = ["services/agent"]
markers = ["e2e: tests that require the running container stack"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["services/agent/app"]
# Composition roots: process wiring with no branching logic of its own. They are
# exercised by `make test-e2e` against the container stack, not by unit tests, so
# counting them here would only dilute the signal from the code that has logic.
omit = [
  "services/agent/app/worker.py",
  "services/agent/app/healthcheck.py",
  "services/agent/app/temporal/client.py",
  "services/agent/app/core/logging.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/agent/app"]
