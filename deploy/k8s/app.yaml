apiVersion: v1
kind: Namespace
metadata:
  name: support-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: support-agent-config
  namespace: support-agent
data:
  ENVIRONMENT: production
  MODEL_PROVIDER: openai
  MODEL_NAME: gpt-5-mini
  CHECKPOINTER_BACKEND: postgres
  KNOWLEDGE_BACKEND: chroma
  CHROMA_HOST: replace-with-managed-chroma-host
  CHROMA_PORT: "443"
  CHROMA_SSL: "true"
  MCP_SERVER_URL: http://mcp-tools:8001/mcp
  AGENT_SERVICE_URL: http://agent:8000
  REDIS_URL: redis://replace-with-managed-redis:6379/0
  LANGSMITH_TRACING: "true"
  LANGSMITH_PROJECT: support-agent-production
---
# Replace this example with External Secrets, AWS Secrets Manager, or GCP Secret Manager.
apiVersion: v1
kind: Secret
metadata:
  name: support-agent-secrets
  namespace: support-agent
type: Opaque
stringData:
  API_KEY: replace-me
  INTERNAL_API_KEY: replace-me
  OPENAI_API_KEY: replace-me
  LANGSMITH_API_KEY: replace-me
  POSTGRES_DSN: postgresql://replace-with-managed-postgres/support?sslmode=require
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: support-agent
spec:
  replicas: 2
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      containers:
        - name: agent
          image: ghcr.io/your-org/support-agent:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: support-agent-config}
            - secretRef: {name: support-agent-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: support-agent
spec:
  selector: {app: agent}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: support-agent
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/support-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: support-agent-config}
            - secretRef: {name: support-agent-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: support-agent
spec:
  type: LoadBalancer
  selector: {app: gateway}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tools
  namespace: support-agent
spec:
  replicas: 2
  selector:
    matchLabels: {app: mcp-tools}
  template:
    metadata:
      labels: {app: mcp-tools}
    spec:
      containers:
        - name: mcp-tools
          image: ghcr.io/your-org/support-mcp-tools:latest
          ports:
            - containerPort: 8001
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tools
  namespace: support-agent
spec:
  selector: {app: mcp-tools}
  ports:
    - port: 8001
      targetPort: 8001
