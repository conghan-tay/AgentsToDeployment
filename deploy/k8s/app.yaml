apiVersion: v1
kind: Namespace
metadata:
  name: support-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: support-agent-config
  namespace: support-agent
data:
  ENVIRONMENT: production
  MODEL_PROVIDER: openai
  MODEL_NAME: gpt-5-mini
  # A Temporal cluster or Temporal Cloud namespace is a prerequisite; it is not
  # deployed by this manifest. See docs/deployment.md.
  TEMPORAL_ADDRESS: replace-with-temporal-host:7233
  TEMPORAL_NAMESPACE: replace-with-namespace
  TEMPORAL_TASK_QUEUE: support-agent
  TEMPORAL_TLS: "true"
  APPROVAL_TIMEOUT_HOURS: "72"
  # Ingestion (gateway) and retrieval (worker) address the same collection with the
  # same embedding model. A mismatch silently destroys retrieval quality.
  CHROMA_URL: https://replace-with-managed-chroma-host
  CHROMA_HOST: replace-with-managed-chroma-host
  CHROMA_PORT: "443"
  CHROMA_SSL: "true"
  CHROMA_COLLECTION: support_knowledge
  EMBEDDING_MODEL: text-embedding-3-small
  MCP_SERVER_URL: http://mcp-tools:8001/mcp
  REDIS_URL: redis://replace-with-managed-redis:6379/0
  LANGSMITH_TRACING: "true"
  LANGSMITH_PROJECT: support-agent-production
---
# Replace this example with External Secrets, AWS Secrets Manager, or GCP Secret Manager.
apiVersion: v1
kind: Secret
metadata:
  name: support-agent-secrets
  namespace: support-agent
type: Opaque
stringData:
  API_KEY: replace-me
  # Required by the gateway to embed knowledge, regardless of the chat provider.
  OPENAI_API_KEY: replace-me
  LANGSMITH_API_KEY: replace-me
  TEMPORAL_API_KEY: replace-me
---
# The worker exposes no port and needs no Service: it polls a Temporal task queue.
# Scale it on task-queue backlog, not on HTTP concurrency.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: support-agent
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/support-agent:latest
          envFrom:
            - configMapRef: {name: support-agent-config}
            - secretRef: {name: support-agent-secrets}
          readinessProbe:
            exec: {command: [python, -m, app.healthcheck]}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: [python, -m, app.healthcheck]}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: support-agent
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/support-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: support-agent-config}
            - secretRef: {name: support-agent-secrets}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: support-agent
spec:
  type: LoadBalancer
  selector: {app: gateway}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tools
  namespace: support-agent
spec:
  replicas: 2
  selector:
    matchLabels: {app: mcp-tools}
  template:
    metadata:
      labels: {app: mcp-tools}
    spec:
      containers:
        - name: mcp-tools
          image: ghcr.io/your-org/support-mcp-tools:latest
          ports:
            - containerPort: 8001
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tools
  namespace: support-agent
spec:
  selector: {app: mcp-tools}
  ports:
    - port: 8001
      targetPort: 8001
